<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英国 18 天 · 行程日历</title>
<style>
:root{
  --paper:#f5efe2; --paper2:#e9dfca; --card:#fffdf6;
  --ink:#131c25; --ink2:#54606b; --ink3:#8a939c;
  --accent:#a3352b; --brass:#a8822f; --line:#d9ceb6; --line2:#c7ba9c;
  --london:#a3352b; --peak:#6d7c3c; --edi:#3f556c;
  --hdr:112px;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC","Source Han Serif SC","Noto Serif SC",serif;
  --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 70% at 82% -12%, #fffaf0 0%, rgba(255,250,240,0) 58%),
    radial-gradient(90% 55% at -5% 105%, #e5dac2 0%, rgba(229,218,194,0) 62%),
    var(--paper);
  color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.55;
  background-image:
    repeating-linear-gradient(0deg,rgba(30,20,5,.020) 0 1px,rgba(0,0,0,0) 1px 3px),
    repeating-linear-gradient(90deg,rgba(30,20,5,.016) 0 1px,rgba(0,0,0,0) 1px 4px);
}
.app{position:relative; z-index:2; height:100%}

/* ---------- header ---------- */
.top{
  position:fixed; top:0; left:0; right:0; height:var(--hdr); z-index:40;
  background:linear-gradient(180deg,rgba(245,239,226,.97),rgba(245,239,226,.88));
  border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
}
.top::after{
  content:""; position:absolute; left:0; right:0; bottom:-4px; height:3px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 28px);
  opacity:.22;
}
.top-in{max-width:1400px; margin:0 auto; height:100%; padding:12px 30px; display:flex; flex-direction:column; justify-content:center; gap:8px}
.top-row{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap}
.brand{font-family:var(--serif); font-size:20px; letter-spacing:.16em; margin:0; font-weight:600}
.brand em{font-style:normal; color:var(--accent)}
.top-meta{font-size:12px; letter-spacing:.08em; color:var(--ink2)}
.top-meta b{color:var(--ink); font-weight:600}
.tape{display:flex; gap:5px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; font-family:var(--mono); font-size:11px; letter-spacing:.04em;
  padding:4px 9px; border:1px solid var(--line2); border-radius:2px; color:var(--ink2);
  background:rgba(255,253,246,.7); cursor:pointer; transition:.22s; white-space:nowrap;
}
.chip:hover{background:var(--card); color:var(--ink); border-color:var(--ink3)}
.chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.chip.ov{font-family:var(--serif); letter-spacing:.12em}

/* ---------- stage ---------- */
.stage{position:fixed; inset:var(--hdr) 0 0 0; overflow:hidden}
.screen{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  opacity:0; transform:translateX(30px); pointer-events:none; padding-bottom:96px;
  transition:opacity .42s ease, transform .5s cubic-bezier(.2,.7,.3,1);
}
.screen.on{opacity:1; transform:none; pointer-events:auto}
.wrap{max-width:1360px; margin:0 auto; padding:26px 30px 10px}

/* ---------- day head ---------- */
.dhead{display:flex; align-items:flex-start; gap:20px; padding-bottom:16px; border-bottom:1px solid var(--line); margin-bottom:20px}
.dno{
  font-family:var(--serif); font-size:62px; line-height:.9; letter-spacing:-.02em;
  color:transparent; -webkit-text-stroke:1.5px var(--line2); flex:0 0 auto; padding-top:4px;
}
.dmeta{flex:1 1 auto; min-width:0}
.ddate{font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--accent); text-transform:uppercase}
.dmeta h2{font-family:var(--serif); font-size:clamp(22px,2.6vw,30px); margin:4px 0 6px; font-weight:600; letter-spacing:.02em; line-height:1.25}
.dsub{font-size:13px; color:var(--ink2)}
.dstay{
  flex:0 0 auto; font-size:11.5px; letter-spacing:.06em; color:var(--ink2);
  border:1px dashed var(--line2); padding:5px 11px; border-radius:2px; background:rgba(255,253,246,.6);
}
.dstay b{color:var(--ink); font-weight:600}

/* ---------- layout ---------- */
.dgrid{display:grid; grid-template-columns:1.02fr .98fr; gap:34px; align-items:start}

/* ---------- art ---------- */
.art{
  position:relative; height:clamp(180px,25vh,290px); border:1px solid var(--line);
  background:var(--card); overflow:hidden; border-radius:2px;
  box-shadow:0 1px 0 var(--line2), 0 14px 30px -22px rgba(40,30,10,.55);
}
.scene{display:block; width:100%; height:100%}
.art-cap{
  position:absolute; left:0; bottom:0; padding:5px 11px; font-family:var(--mono);
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#fff;
  background:rgba(19,28,37,.66); backdrop-filter:blur(2px);
}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0}
.tag{
  font-size:11.5px; letter-spacing:.02em; padding:3px 9px; border-radius:999px;
  border:1px solid var(--line2); color:var(--ink2); background:rgba(255,253,246,.65);
}
.tag.hp{border-color:#b48a3a; color:#8a6320}
.tag.cn{border-color:var(--accent); color:var(--accent)}
.tag.warn{border-color:#c07a3a; color:#a35a1d; background:rgba(240,200,150,.28)}
.tag.ok{border-color:#7d8f52; color:#5c6b34}

/* ---------- map ---------- */
.mapbox{margin-top:14px; border:1px solid var(--line); background:
  linear-gradient(180deg,rgba(255,253,246,.9),rgba(240,234,219,.55)); border-radius:2px; padding:6px 6px 2px}
.map{display:block; width:100%; height:auto}
.legend{display:flex; flex-wrap:wrap; gap:12px; padding:2px 8px 8px; font-size:10.5px; color:var(--ink2); letter-spacing:.03em}
.legend i{display:inline-block; width:20px; height:0; border-top-width:2px; border-top-style:solid; vertical-align:middle; margin-right:5px}

/* ---------- timeline ---------- */
.tl{list-style:none; margin:0; padding:0 4px 0 0; max-height:calc(100vh - var(--hdr) - 200px); overflow-y:auto}
.tl::-webkit-scrollbar{width:5px}
.tl::-webkit-scrollbar-thumb{background:var(--line2); border-radius:3px}
.tl-i{display:grid; grid-template-columns:56px 22px 1fr; gap:0; padding:0}
.tl-t{font-family:var(--mono); font-size:12px; color:var(--ink2); padding-top:11px; letter-spacing:.02em}
.tl-rail{position:relative; display:flex; justify-content:center}
.tl-rail::before{content:""; position:absolute; top:0; bottom:0; width:1px; background:var(--line)}
.tl-i:first-child .tl-rail::before{top:16px}
.tl-i:last-child .tl-rail::before{bottom:calc(100% - 16px)}
.tl-d{
  position:relative; z-index:1; width:7px; height:7px; border-radius:50%;
  background:var(--paper); border:1px solid var(--line2); margin-top:15px;
}
.tl-i.key .tl-d{background:var(--rc,var(--accent)); border-color:var(--rc,var(--accent)); box-shadow:0 0 0 3px rgba(163,53,43,.12)}
.tl-c{padding:8px 0 14px 12px; min-width:0}
.tl-n{font-size:14.5px; font-weight:600; letter-spacing:.01em; display:flex; gap:8px; align-items:flex-start}
.pin{
  flex:0 0 auto; width:17px; height:17px; border-radius:50%; background:var(--rc,var(--accent));
  color:#fff; font-family:var(--mono); font-size:10px; line-height:17px; text-align:center; margin-top:2px;
}
.tl-x{font-size:12.5px; color:var(--ink2); margin-top:3px; line-height:1.65}
.note{
  margin-top:16px; padding:12px 14px; border-left:2px solid var(--rc,var(--accent));
  background:rgba(255,253,246,.72); font-size:12.5px; color:var(--ink2); line-height:1.7;
}
.note b{color:var(--ink); font-weight:600}

/* ---------- overview ---------- */
.ov-hero{display:grid; grid-template-columns:1.15fr .85fr; gap:36px; align-items:start}
.ov-kicker{font-family:var(--mono); font-size:11.5px; letter-spacing:.24em; color:var(--accent); text-transform:uppercase}
.ov-h1{font-family:var(--serif); font-size:clamp(30px,4.6vw,52px); line-height:1.12; margin:10px 0 14px; letter-spacing:.01em; font-weight:600}
.ov-h1 span{color:var(--accent)}
.ov-p{font-size:14px; color:var(--ink2); max-width:46ch; line-height:1.85}
.ov-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:24px; border-top:1px solid var(--line); padding-top:18px}
.ov-stats div b{display:block; font-family:var(--serif); font-size:26px; line-height:1.1}
.ov-stats div span{font-size:11px; letter-spacing:.08em; color:var(--ink3)}
.ov-map{border:1px solid var(--line); background:linear-gradient(180deg,#fffdf6,#f1ead9); border-radius:2px; padding:10px}
.route3{display:grid; gap:8px; margin-top:16px}
.r3{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink2)}
.r3 b{font-weight:600; color:var(--ink); font-family:var(--mono); font-size:11.5px; letter-spacing:.06em}
.r3 em{flex:1; height:1px; background:repeating-linear-gradient(90deg,var(--line2) 0 5px,transparent 5px 10px)}

/* ---------- controls ---------- */
.ctrls{
  position:fixed; left:0; right:0; bottom:0; height:64px; z-index:40;
  display:flex; align-items:center; justify-content:center; gap:14px;
  background:linear-gradient(0deg,rgba(245,239,226,.99),rgba(245,239,226,.82));
  border-top:1px solid var(--line); backdrop-filter:blur(8px);
}
.nb{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line2); background:var(--card);
  color:var(--ink); font-size:16px; cursor:pointer; transition:.2s; display:grid; place-items:center;
}
.nb:hover{background:var(--ink); color:var(--paper); border-color:var(--ink); transform:translateY(-1px)}
.nb:disabled{opacity:.3; cursor:default; transform:none; background:var(--card); color:var(--ink)}
.prog{width:min(38vw,340px); height:2px; background:var(--line); position:relative}
.prog i{position:absolute; left:0; top:0; bottom:0; background:var(--accent); transition:width .45s cubic-bezier(.2,.7,.3,1)}
.cnt{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; color:var(--ink2); min-width:64px; text-align:center}
.cnt b{color:var(--ink)}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.screen.on .art{animation:fadeIn .7s ease both}
.screen.on .tl-i{animation:rise .5s ease both; animation-delay:calc(var(--i) * 42ms + .12s)}
.screen.on .mtx{animation:pop .45s ease both; animation-delay:calc(var(--i) * 70ms + .25s)}
.screen.on .dhead{animation:rise .55s ease both}
.screen.on .ov-hero > *{animation:rise .6s ease both}
.screen.on .ov-hero > *:nth-child(2){animation-delay:.1s}

/* ---------- responsive ---------- */
@media (max-width:980px){
  :root{--hdr:96px}
  .wrap{padding:18px 16px 10px}
  .dgrid{grid-template-columns:1fr; gap:18px}
  .ov-hero{grid-template-columns:1fr; gap:22px}
  .ov-stats{grid-template-columns:repeat(2,1fr)}
  .dno{font-size:44px}
  .dhead{gap:12px; flex-wrap:wrap}
  .dstay{order:3}
  .tl{max-height:none; overflow:visible}
  .top-in{padding:10px 16px; gap:6px}
  .brand{font-size:16px; letter-spacing:.1em}
  .top-meta{font-size:11px}
  .art{height:190px}
  .legend{gap:8px; font-size:10px}
  .cnt{min-width:52px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="top-in">
      <div class="top-row">
        <h1 class="brand">英国 <em>18</em> 天 · 行程日历</h1>
        <div class="top-meta">伦敦 <b>13 晚</b> · 峰区 <b>1 晚</b> · 爱丁堡 <b>2 晚</b> · 2027.01.15 – 02.01</div>
      </div>
      <div class="tape" id="tape"></div>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <div class="ctrls">
    <button class="nb" id="prev" aria-label="上一天">&#8592;</button>
    <div class="prog"><i id="prog" style="width:0"></i></div>
    <div class="cnt" id="cnt"><b>1</b> / 19</div>
    <button class="nb" id="next" aria-label="下一天">&#8594;</button>
  </div>

</div>

/* ============================================================
   渲染 + 翻页
   ============================================================ */
const RC = {london:'var(--london)', peak:'var(--peak)', edi:'var(--edi)'};
const MODE_LABEL = {walk:'步行', tube:'地铁', train:'火车', bus:'公交', taxi:'打车', fly:'飞机'};
const MODE_DASH = {walk:'3 4', tube:'', train:'9 5', bus:'2 5', taxi:'6 3', fly:'1 5'};
const MODE_W = {walk:1.4, tube:2.2, train:2.2, bus:1.8, taxi:1.8, fly:2.4};
const MODE_C = {walk:'#8a939c', tube:'#2b3a47', train:'#a3352b', bus:'#6d7c3c', taxi:'#6d7c3c', fly:'#a8822f'};

const $stage = document.getElementById('stage');
const $tape  = document.getElementById('tape');
const $prog  = document.getElementById('prog');
const $cnt   = document.getElementById('cnt');
const $prev  = document.getElementById('prev');
const $next  = document.getElementById('next');

function shortName(s){
  var p = String(s).split(/[ ·]+/);
  return p[0];
}

/* ---------- 单日路线示意图 ---------- */
function mapSVG(day){
  var rc = RC[day.rc] || 'var(--london)';
  var stops = (day.map && day.map.stops) || [];
  var segs  = (day.map && day.map.segs) || [];
  var px = function(v){ return 20 + v / 100 * 360; };
  var py = function(v){ return 12 + v / 100 * 150; };

  var grid = '';
  for (var gx = 0; gx <= 400; gx += 40){
    grid += '<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="180" stroke="#131c25" stroke-width=".4" opacity=".07"/>';
  }
  for (var gy = 0; gy <= 180; gy += 30){
    grid += '<line x1="0" y1="' + gy + '" x2="400" y2="' + gy + '" stroke="#131c25" stroke-width=".4" opacity=".07"/>';
  }

  var paths = '';
  var modesUsed = {};
  segs.forEach(function(sg){
    var a = stops[sg[0]], b = stops[sg[1]];
    if (!a || !b) return;
    var m = sg[2] || 'walk';
    modesUsed[m] = 1;
    paths += '<line x1="' + px(a.x) + '" y1="' + py(a.y) + '" x2="' + px(b.x) + '" y2="' + py(b.y) + '" '
      + 'stroke="' + MODE_C[m] + '" stroke-width="' + MODE_W[m] + '" '
      + (MODE_DASH[m] ? 'stroke-dasharray="' + MODE_DASH[m] + '" ' : '')
      + 'stroke-linecap="round" opacity=".9"/>';
  });

  var nodes = '', nums = {};
  stops.forEach(function(s, i){
    nums[s.k] = i + 1;
    var cx = px(s.x), cy = py(s.y);
    var label = shortName((day.it[s.k] || {}).n || '');
    var anchor = s.x > 68 ? 'end' : (s.x < 32 ? 'start' : 'middle');
    var ly = (i % 2 === 0) ? cy - 13 : cy + 21;
    nodes += '<circle cx="' + cx + '" cy="' + cy + '" r="10" fill="#fffdf6"/>'
      + '<circle cx="' + cx + '" cy="' + cy + '" r="9" fill="' + rc + '"/>'
      + '<text x="' + cx + '" y="' + (cy + 3) + '" text-anchor="middle" font-size="9" '
      + 'fill="#fffdf6" font-family="Georgia,serif">' + (i + 1) + '</text>'
      + '<text x="' + cx + '" y="' + ly + '" text-anchor="' + anchor + '" font-size="8" '
      + 'fill="#2b3a47" font-family="PingFang SC,Microsoft YaHei,sans-serif">' + label + '</text>';
  });

  var legend = '';
  Object.keys(modesUsed).forEach(function(m){
    legend += '<span><i style="border-top-color:' + MODE_C[m] + ';border-top-style:'
      + (MODE_DASH[m] ? 'dashed' : 'solid') + '"></i>' + MODE_LABEL[m] + '</span>';
  });

  var svg = '<svg class="map" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">'
    + grid + paths + nodes + '</svg>';

  return '<div class="mapbox">' + svg + '<div class="legend">'
    + '<span><i style="border-top-color:' + rc + ';border-top-style:solid"></i>站点顺序</span>'
    + legend + '<span style="margin-left:auto;opacity:.6">示意图 · 非实际比例</span>'
    + '</div></div>';
}

/* ---------- 单日页 ---------- */
function dayHTML(day, idx){
  var rc = RC[day.rc] || 'var(--london)';
  var num = (idx < 10 ? '0' : '') + idx;
  var pinOf = {};
  ((day.map && day.map.stops) || []).forEach(function(s, i){ pinOf[s.k] = i + 1; });

  var tl = day.it.map(function(it, i){
    var isStop = pinOf[i] !== undefined;
    return '<li class="tl-i' + (isStop ? ' key' : '') + '" style="--i:' + i + ';--rc:' + rc + '">'
      + '<div class="tl-t">' + it.t + '</div>'
      + '<div class="tl-rail"><span class="tl-d"></span></div>'
      + '<div class="tl-c"><div class="tl-n">'
      + (isStop ? '<span class="pin">' + pinOf[i] + '</span>' : '')
      + it.n + '</div>'
      + '<div class="tl-x">' + it.d + '</div></div></li>';
  }).join('');

  var tags = day.tags.map(function(t){
    return '<span class="tag ' + (t[0] || '') + '">' + t[1] + '</span>';
  }).join('');

  return '<div class="wrap" style="--rc:' + rc + '">'
    + '<div class="dhead">'
      + '<div class="dno">' + num + '</div>'
      + '<div class="dmeta"><div class="ddate">' + day.d + ' · ' + day.wd + ' · ' + day.city + '</div>'
      + '<h2>' + day.title + '</h2><div class="dsub">' + day.sub + '</div></div>'
      + '<div class="dstay">住宿 <b>' + day.stay + '</b></div>'
    + '</div>'
    + '<div class="dgrid">'
      + '<div>'
        + '<div class="art">' + (SCENES[day.scene] || SCENES.done)
        + '<span class="art-cap">' + day.cap + '</span></div>'
        + '<div class="tags">' + tags + '</div>'
        + mapSVG(day)
      + '</div>'
      + '<div><ol class="tl">' + tl + '</ol>'
        + '<div class="note"><b>安排说明 · </b>' + day.note + '</div>'
      + '</div>'
    + '</div></div>';
}

/* ---------- 总览页 ---------- */
function overviewHTML(){
  var spine = '<svg class="map" viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg">'

    + '<g font-family="PingFang SC,sans-serif" font-size="8" fill="#8a6320">'
    + '<text x="268" y="171">牛津 1/20</text><text x="268" y="199">温莎 1/22</text>'

    + '<g stroke="#a8822f" stroke-width=".9" stroke-dasharray="2 4" opacity=".85">'
    + '<path d="M116 256 L262 282"/></g>'
    + '<text x="268" y="285" font-family="PingFang SC,sans-serif" font-size="8" fill="#8a6320">格林尼治 1/28</text>'

  var rows = [

        + '因为要取行李并回到伦敦的住处，这一段坐飞机比火车省 3 小时。</div>'

/* ---------- 组装 ---------- */
var SCREENS = [];
function buildAll(){
  var html = '<section class="screen" data-i="0">' + overviewHTML() + '</section>';
  DAYS.forEach(function(d, i){
    html += '<section class="screen" data-i="' + (i + 1) + '">' + dayHTML(d, i + 1) + '</section>';
  });
  $stage.innerHTML = html;
  SCREENS = Array.prototype.slice.call($stage.querySelectorAll('.screen'));

  var chips = '<button class="chip ov" data-i="0">总览</button>';
  DAYS.forEach(function(d, i){
    chips += '<button class="chip" data-i="' + (i + 1) + '" title="' + d.title + '">'
      + d.d + '<span style="opacity:.55"> ' + d.wd.replace('周', '') + '</span></button>';
  });
  $tape.innerHTML = chips;
  $tape.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ go(parseInt(c.dataset.i, 10)); });
  });
}

/* ---------- 翻页 ---------- */
var cur = 0;
function go(i){
  if (i < 0) i = 0;
  if (i > SCREENS.length - 1) i = SCREENS.length - 1;
  if (i === cur && SCREENS[i].classList.contains('on')) return;
  SCREENS.forEach(function(s, k){
    s.classList.toggle('on', k === i);
    if (k !== i) s.scrollTop = 0;
  });
  cur = i;
  $prog.style.width = (i / (SCREENS.length - 1) * 100) + '%';
  $cnt.innerHTML = '<b>' + (i === 0 ? '总览' : 'D' + i) + '</b> / ' + DAYS.length;
  $prev.disabled = (i === 0);
  $next.disabled = (i === SCREENS.length - 1);
  $tape.querySelectorAll('.chip').forEach(function(c){
    var on = parseInt(c.dataset.i, 10) === i;
    c.classList.toggle('on', on);
    if (on && c.scrollIntoView) {
      c.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    }
  });
}

$prev.addEventListener('click', function(){ go(cur - 1); });
$next.addEventListener('click', function(){ go(cur + 1); });

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); go(cur + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(cur - 1); }
  if (e.key === 'Home'){ e.preventDefault(); go(0); }
  if (e.key === 'End'){ e.preventDefault(); go(SCREENS.length - 1); }
});

/* 触屏滑动 */
var tx = 0, ty = 0, tt = 0;
$stage.addEventListener('touchstart', function(e){
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now();
}, {passive:true});
$stage.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - tx;
  var dy = e.changedTouches[0].clientY - ty;
  if (Date.now() - tt > 700) return;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6){
    go(dx < 0 ? cur + 1 : cur - 1);
  }
}, {passive:true});

buildAll();
go(0);

</script>
</body>
</html>
